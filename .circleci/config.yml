version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install test dependencies
          command: python -m pip install --upgrade pip pytest python-docx openpyxl python-pptx && python -m pip install -e .
      - run:
          name: Compile and test
          command: python -m compileall -q office_sanitizer tests && python -m pytest -q
      - run:
          name: Build and verify packages
          command: |
            python -m pip wheel . --no-deps -w dist
            python -m pip install --force-reinstall --no-deps dist/*.whl
            office-sanitizer --help
            python -c 'import office_sanitizer.gui'
            bash scripts/build_deb.sh
            dpkg-deb --info dist/office-sanitizer_4.1.0~beta1_all.deb
      - store_artifacts:
          path: dist
          destination: packages
workflows:
  build-test:
    jobs:
      - test

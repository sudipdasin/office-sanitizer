version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: python -m pip install --upgrade pip pytest python-docx openpyxl python-pptx && python -m pip install -e . && python -m pip install -e .
      - run:
          name: Compile
          command: python -m compileall -q office_sanitizer tests
      - run:
          name: Run tests
          command: python -m pytest -q
      - run:
          name: Package and verify installable Python wheel
          command: |
            python -m pip wheel . --no-deps -w /tmp/dist
            python -m pip install --force-reinstall --no-deps /tmp/dist/*.whl
            office-sanitizer --help
            python -c 'import office_sanitizer.gui; print("GUI imports headlessly")'
workflows:
  build-test:
    jobs:
      - test

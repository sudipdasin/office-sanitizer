[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "office-sanitizer"
version = "2.0.0a1"
description = "Offline, fail-closed OOXML metadata sanitizer with macro binary preservation"
requires-python = ">=3.10"
license = "GPL-3.0-only"
[project.scripts]
office-sanitizer = "office_sanitizer.__main__:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
